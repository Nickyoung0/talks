<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>从扩展机制看 PostgreSQL 的设计哲学｜OpenTenBase 城市行 · 西安站</title>
<meta name="description" content="OpenTenBase 城市行西安站（2026.11.07 西安邮电大学）主题分享：从扩展机制看 PostgreSQL 的设计哲学。动态网页演示，支持翻页、分步揭示、总览跳转与 PDF 导出（每页一张）。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23015CB7' d='M4 6h10v10H4z'/%3E%3Cpath fill='%2335C6FF' d='M18 6h10v10H18z'/%3E%3Cpath fill='%23003C83' d='M4 18h10v10H4z'/%3E%3Cpath fill='%237A5CFF' d='M18 18h10v10H18z'/%3E%3C/svg%3E">
<!-- 版本号 v= 用于破除浏览器/CDN 缓存：每次更新内容后把 ?v= 递增即可，手机上刷新就是最新版 -->
<link rel="stylesheet" href="assets/css/deck.css?v=20261027a">
<link rel="stylesheet" href="assets/css/machine.css?v=20261027a">
<link rel="stylesheet" href="assets/css/elephant.css?v=20261027a">
<link rel="stylesheet" href="assets/css/blocks.css?v=20261027a">
</head>
<body>
<div id="timebar" aria-hidden="true"></div>
<div id="stage-wrap"><div id="stage-size"><div id="stage"></div></div></div>

<div id="hud" role="toolbar" aria-label="演示控制">
  <span class="hint">·</span>
  <span class="pagenum">1 / 1</span>
  <button class="prev" title="上一页">‹</button>
  <button class="next" title="下一步">›</button>
  <button class="ov" title="总览 (O)">总览</button>
  <button class="pres" title="演讲者视图 (N)">讲稿</button>
  <button class="vfit" title="切换：整页 / 铺满宽度">整页</button>
  <button class="zout" title="缩小">－</button>
  <button class="zin" title="放大">＋</button>
  <button class="rot" title="切换为竖屏视图（画布旋转 90°，竖屏下也能铺满屏宽）">竖屏</button>
  <button class="fs" title="全屏 (F)">全屏</button>
</div>

<div id="overview" aria-label="幻灯片总览">
  <h2>全部页面 · 点击跳转（Esc 关闭）</h2>
  <div class="ov-grid"></div>
</div>

<aside id="presenter" aria-label="演讲者视图">
  <header>
    <h2></h2><span class="p-meta"></span>
    <div id="timer"><span class="read">00:00</span><button class="toggle">开始</button><button class="reset">清零</button></div>
  </header>
  <div class="p-body">
    <div class="p-col"><h3>讲稿 · 可直接转述</h3><div class="p-text"></div></div>
    <div class="p-col"><h3>技术展开 · 备查</h3><div class="p-detail"></div></div>
  </div>
  <footer>
    <span class="next-tip"></span><span class="design-tip"></span>
    <button class="close">关闭（N）</button>
  </footer>
</aside>

<div id="video-modal" aria-hidden="true">
  <button class="vm-close" type="button" title="关闭（Esc）">✕</button>
  <div class="vm-stage"></div>
</div>

<div id="rotate-hint" aria-hidden="true">
  <div>
    <div class="rh-icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7fd3ff" stroke-width="3" stroke-linecap="round">
        <rect x="14" y="6" width="20" height="36" rx="4"></rect>
        <path d="M40 14c3 3 3 17 0 20" stroke-dasharray="3 5"></path>
      </svg>
    </div>
    <h2>建议横屏浏览</h2>
    <p>本页为 16:9 演示画布，横屏体验最佳。<br>不开旋转锁定时，也可以直接竖屏查看（画布会自动旋转 90°）。</p>
    <button class="rh-skip" type="button">竖屏查看</button>
  </div>
</div>

<div id="help">
  <div class="help-card">
    <h2>操作方式</h2>
    <table>
      <tr><td><kbd>→</kbd> <kbd>空格</kbd></td><td>下一步（先逐条揭示，再翻页）</td></tr>
      <tr><td><kbd>←</kbd></td><td>上一页（回看时显示全部要点）</td></tr>
      <tr><td><kbd>数字</kbd>+<kbd>回车</kbd></td><td>跳转到指定页</td></tr>
      <tr><td><kbd>O</kbd></td><td>总览网格</td></tr>
      <tr><td><kbd>N</kbd></td><td>演讲者视图（讲稿 + 计时器）</td></tr>
      <tr><td><kbd>F</kbd></td><td>全屏</td></tr>
      <tr><td><kbd>B</kbd></td><td>黑屏</td></tr>
      <tr><td><kbd>R</kbd></td><td>横屏 / 竖屏视图切换（竖屏时画布旋转 90°）</td></tr>
      <tr><td><kbd>Ctrl/Cmd</kbd>+<kbd>P</kbd></td><td>打印 / 导出 PDF（每页一张）</td></tr>
    </table>
  </div>
</div>

<script src="assets/js/slides-data.js?v=20261027a"></script>
<script src="assets/js/machine.js?v=20261027a"></script>
<script src="assets/js/elephant.js?v=20261027a"></script>
<script src="assets/js/loupe.js?v=20261027a"></script>
<script src="assets/js/blocks.js?v=20261027a"></script>
<script src="assets/js/land-data.js?v=20261027a"></script>
<script src="assets/js/land-hit.js?v=20261027a"></script>
<script src="assets/js/key-islands.js?v=20261027a"></script>
<script src="assets/js/globe.js?v=20261027a"></script>
<script src="assets/js/deck.js?v=20261027a"></script>
</body>
</html>
